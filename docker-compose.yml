services:
  backend:
    image: ticket-hive-backend
    build:
      context: ./backend
    container_name: backend
    expose:
      - "5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ticket-hive
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: ticket-hive-client
    build:
      context: ./client
      args:
        VITE_ENV_MODE: production
        # Empty -> socket.ts falls back to window.location.origin,
        # so the browser connects to /socket.io on this origin and the
        # edge nginx proxies it to the backend.
        VITE_SOCKET_URL: ""
    container_name: client
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - client
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
